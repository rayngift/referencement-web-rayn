/* ===== Utilitaires ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^(https?:\/\/|data:image\/)/i.test(u||"")?u:"";
let lang=store.get("lang");if(!T[lang])lang="fr";

/* ===== Rendu dynamique ===== */
function render(){
 const L=T[lang];
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $$("[data-i]").forEach(e=>e.textContent=L[e.dataset.i]);
 $("#skg").innerHTML=SKILLS.map(s=>`<div class="card rv in"><div class="ic" dir="ltr">${esc(s.ic)}</div><h3>${L[s.k]}</h3><div class="tags" dir="ltr">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>`).join("");
 $("#prg").innerHTML=PROJECTS.map(p=>{const [t,d]=p.t[lang];const g=safeUrl(p.gh),m=safeUrl(p.demo);
  return `<article class="card rv in"><div class="pimg" aria-hidden="true">${p.ic}</div><span class="badge">${L["st_"+p.status]}</span><h3 style="margin-top:10px">${esc(t)}</h3><p>${esc(d)}</p><div class="tags" dir="ltr">${p.tech.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>${g||m?`<div class="lk">${g?`<a href="${g}" target="_blank" rel="noopener noreferrer">${L.code} ↗</a>`:""}${m?`<a href="${m}" target="_blank" rel="noopener noreferrer">${L.demo} ↗</a>`:""}</div>`:""}</article>`}).join("");
 $("#ceg").innerHTML=(CERTS.length?CERTS.map(c=>{const u=safeUrl(c.url);return `<div class="card rv in"><h3>${esc(c.n)}</h3><p>${esc(c.org)} · ${esc(c.date)}</p><div class="tags">${(c.skills||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>${u?`<div class="lk"><a href="${u}" target="_blank" rel="noopener noreferrer">↗</a></div>`:""}</div>`}).join(""):`<div class="card empty"><p>${L.ceE}</p></div>`)+`<div class="card empty"><p>${L.ceW}</p></div>`;
 $("#gal").innerHTML=GALLERY.map((g,i)=>{const s=safeUrl(g.src);return `<button class="gi" data-k="${i}" aria-label="${esc(g.alt||L.gaE)}">${s?`<img src="${s}" alt="${esc(g.alt)}" loading="lazy">`:L.gaE}</button>`}).join("");
 const hasMail=!!CFG.email;$("#mail").textContent=hasMail?CFG.email:L.noMail;$("#mail").href=hasMail?"mailto:"+CFG.email:"#contact";
}
/* ===== Liens sociaux ===== */
function links(){
 [["#gh",CFG.github],["#gh2",CFG.github],["#li",CFG.linkedin],["#li2",CFG.linkedin]].forEach(([s,u])=>{const e=$(s),v=safeUrl(u);if(v)e.href=v;else{e.style.display="none"}});
 const p=safeUrl(CFG.photo);if(p)$("#photo").innerHTML=`<img src="${p}" alt="Rayen Chaaouri">`;
 $("#yr").textContent=new Date().getFullYear();
}
/* ===== Langue & thème ===== */
$("#lang").value=lang;
$("#lang").onchange=e=>{lang=e.target.value;store.set("lang",lang);render();watch()};
const th=store.get("theme");if(th)document.documentElement.dataset.theme=th;
$("#theme").onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";d.dataset.theme=n;store.set("theme",n)};
/* ===== Menu mobile ===== */
const lk=$("#links"),bg=$("#burger");
bg.onclick=()=>{const o=lk.classList.toggle("open");bg.setAttribute("aria-expanded",o)};
lk.addEventListener("click",e=>{if(e.target.tagName==="A"){lk.classList.remove("open");bg.setAttribute("aria-expanded",false)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){lk.classList.remove("open");closeLb()}});
/* ===== Progression + lien actif ===== */
addEventListener("scroll",()=>{const h=document.documentElement;$("#prog").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100||0)+"%"},{passive:true});
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$(".links a").forEach(a=>a.classList.toggle("act",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
$$("main section[id]").forEach(s=>io2.observe(s));
/* ===== Apparition au défilement ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
function watch(){$$(".rv:not(.in)").forEach(e=>io.observe(e))}
/* ===== Lightbox ===== */
let cur=0;const lb=$("#lb");
function showLb(){const g=GALLERY[cur],s=safeUrl(g.src);$("#lc").innerHTML=s?`<img src="${s}" alt="${esc(g.alt)}">`:`<div class="ph2">${T[lang].gaE}</div>`}
function closeLb(){lb.classList.remove("on")}
$("#gal").addEventListener("click",e=>{const b=e.target.closest(".gi");if(b){cur=+b.dataset.k;showLb();lb.classList.add("on");$("#lx").focus()}});
$("#lx").onclick=closeLb;lb.onclick=e=>{if(e.target===lb)closeLb()};
const step=d=>{cur=(cur+d+GALLERY.length)%GALLERY.length;showLb()};
$("#lp").onclick=()=>step(-1);$("#ln").onclick=()=>step(1);
addEventListener("keydown",e=>{if(lb.classList.contains("on")){if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)}});
/* ===== Formulaire (sans backend : ouverture du client mail) ===== */
$("#cf").addEventListener("submit",e=>{
 e.preventDefault();const L=T[lang],f=e.target,m=$("#fm");
 const v={n:f.n.value.trim(),e:f.e.value.trim(),s:f.s.value.trim(),m:f.m.value.trim()};
 [f.n,f.e,f.s,f.m].forEach(x=>x.classList.toggle("bad",!x.value.trim()));
 if(!v.n||!v.e||!v.s||!v.m){m.textContent=L.eReq;m.style.color="#EF4444";return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.e)){f.e.classList.add("bad");m.textContent=L.eMail;m.style.color="#EF4444";return}
 if(!CFG.email){m.textContent=L.noMail;return}
 const body=v.m+"\n\n— "+v.n+" ("+v.e+")";
 location.href="mailto:"+CFG.email+"?subject="+encodeURIComponent(v.s)+"&body="+encodeURIComponent(body);
 m.textContent=L.ok;m.style.color="var(--cy)";
});
/* ===== Particules légères ===== */
(function(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const c=$("#bgc"),x=c.getContext("2d");let w,h,P=[],mx=-999,my=-999;
 function size(){w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(50,Math.floor(w/28))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}))}
 size();addEventListener("resize",size);addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY},{passive:true});
 (function loop(){
  if(!document.hidden){x.clearRect(0,0,w,h);x.fillStyle="rgba(6,182,212,.55)";x.strokeStyle="rgba(79,70,229,.18)";
   P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
    const dx=p.x-mx,dy=p.y-my,d=dx*dx+dy*dy;if(d<10000){p.x+=dx*.01;p.y+=dy*.01}
    x.beginPath();x.arc(p.x,p.y,1.6,0,6.28);x.fill();
    for(let j=i+1;j<P.length;j++){const q=P[j],ax=p.x-q.x,ay=p.y-q.y;if(ax*ax+ay*ay<14000){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}})}
  requestAnimationFrame(loop)})();
})();
/* ===== Init ===== */
render();links();watch();
</script>
</body>
